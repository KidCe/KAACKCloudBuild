name: Build KAACK firmware
run-name: KAACK build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Deterministic request id"
        required: true
        type: string
      version:
        description: "Display release identifier"
        required: true
        type: string
      config_ref:
        description: "Optional pinned betaflight/config ref for legacy KAACK branches"
        required: false
        default: ""
        type: string
      source_ref:
        description: "Validated Git tag or branch to check out"
        required: true
        type: string
      target:
        description: "Validated flight-controller target"
        required: true
        type: string
      flags_json:
        description: "Server-normalized JSON array of USE_* flags"
        required: true
        type: string
      build_key:
        description: "Optional official Cloud Build key for byte-for-byte comparison"
        required: false
        default: ""
        type: string
      release_name:
        description: "Optional official Cloud Build release name for comparison"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: kaack-build-${{ inputs.build_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIRMWARE_REPOSITORY: ${{ vars.FIRMWARE_REPOSITORY || 'limonspb/betaflight' }}
      VERSION: ${{ inputs.version }}
      SOURCE_REF: ${{ inputs.source_ref }}
      CONFIG_REF: ${{ inputs.config_ref }}
      REQUEST_TARGET: ${{ inputs.target }}
      BUILD_ID: ${{ inputs.build_id }}
      FLAGS_JSON: ${{ inputs.flags_json }}
      BUILD_KEY: ${{ inputs.build_key }}
      RELEASE_NAME: ${{ inputs.release_name }}
    steps:
      - name: Require the approved firmware source
        shell: bash
        run: |
          test -n "${FIRMWARE_REPOSITORY}" || { echo "Set the repository Actions variable FIRMWARE_REPOSITORY to the approved KAACK fork before building."; exit 1; }
          test "${FIRMWARE_REPOSITORY}" = "limonspb/betaflight" || { echo "Only limonspb/betaflight is approved for KAACK builds."; exit 1; }
          test -n "${SOURCE_REF}" || { echo "The builder must provide an approved source ref."; exit 1; }
          [[ "${SOURCE_REF}" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid source ref"; exit 1; }
          [[ -z "${CONFIG_REF}" || "${CONFIG_REF}" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid config ref"; exit 1; }
          [[ -z "${BUILD_KEY}" || "${BUILD_KEY}" =~ ^[A-Za-z0-9-]+$ ]] || { echo "Invalid build key"; exit 1; }
          [[ -z "${RELEASE_NAME}" || "${RELEASE_NAME}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid release name"; exit 1; }
          case "${SOURCE_REF}" in
            KAACK-4.5.0) test "${CONFIG_REF}" = "9a9f899aab4c4ffaa74f973a643447b48453ff54" || { echo "KAACK-4.5.0 requires its compatible pinned config ref."; exit 1; } ;;
            KAACK-2025.12) test -z "${CONFIG_REF}" || { echo "KAACK-2025.12 must use its checked-out config submodule."; exit 1; } ;;
            *) echo "Source ref is not an approved KAACK branch: ${SOURCE_REF}"; exit 1 ;;
          esac

      - name: Checkout firmware source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.FIRMWARE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: firmware
          fetch-depth: 1
          submodules: recursive

      - name: Cache firmware toolchain
        uses: actions/cache@v4
        id: toolchain-cache
        with:
          path: firmware/tools
          key: ${{ runner.os }}-kaack-${{ hashFiles('firmware/mk/tools.mk') }}

      - name: Install firmware toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: firmware
        shell: bash
        run: make arm_sdk_install

      - name: Install UF2 tool when supported
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: firmware
        shell: bash
        run: |
          if grep -Rqs 'picotool_install' Makefile mk; then
            make picotool_install
          else
            echo "This KAACK branch does not provide picotool_install; HEX output remains available."
          fi

      - name: Validate and build target
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          target="${REQUEST_TARGET}"
          test "${target}" = "${target^^}" || { echo "Target must be uppercase"; exit 1; }
          [[ "${target}" =~ ^[A-Z0-9_-]+$ ]] || { echo "Invalid target"; exit 1; }
          printf '%s' "${FLAGS_JSON}" | jq -e 'type == "array" and all(.[]; test("^USE_[A-Z0-9_]+$"))' >/dev/null || { echo "Invalid flags JSON"; exit 1; }
          mapfile -t flags < <(printf '%s' "${FLAGS_JSON}" | jq -r '.[]')
          build_key="${BUILD_KEY:-${BUILD_ID}}"
          release_name="${RELEASE_NAME:-${VERSION}}"
          extra_flags="-DCLOUD_BUILD -DBUILD_KEY=\\\"${build_key}\\\" -DRELEASE_NAME=\\\"${release_name}\\\""
          for flag in "${flags[@]}"; do
            [[ "${flag}" =~ ^USE_[A-Z0-9_]+$ ]] || { echo "Invalid build flag: ${flag}"; exit 1; }
            extra_flags+=" -D${flag}"
          done
          if [[ -n "${CONFIG_REF}" ]]; then
            rm -rf src/config
            git clone https://github.com/betaflight/config src/config
            git -C src/config checkout --detach "${CONFIG_REF}"
          else
            make configs
          fi
          if [[ -f "src/config/configs/${target}/config.h" ]]; then
            build_command=(make -j7 "${target}" EXTRA_FLAGS="${extra_flags}")
            uf2_command=(make uf2 CONFIG="${target}" EXTRA_FLAGS="${extra_flags}")
          elif find src/platform -path "*/target/${target}/target.mk" -print -quit | grep -q .; then
            build_command=(make -j7 "${target}" EXTRA_FLAGS="${extra_flags}")
            uf2_command=(make uf2 TARGET="${target}" EXTRA_FLAGS="${extra_flags}")
          else
            echo "Target ${target} is not present in the source checkout or hydrated config repository."
            exit 1
          fi
          echo "Building HEX with: ${build_command[*]}"
          "${build_command[@]}"
          echo "Building optional UF2 with: ${uf2_command[*]}"
          if ! "${uf2_command[@]}"; then
            echo "UF2 output is unavailable for ${target}; continuing with the verified HEX artifact."
          fi

      - name: Collect firmware and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          find firmware/obj -maxdepth 1 -type f \( -name '*.hex' -o -name '*.uf2' \) -size +0c -exec cp {} output/ \;
          test -n "$(find output -maxdepth 1 -type f -name '*.hex' -size +0c -print -quit)" || { echo "No non-empty HEX firmware artifact found"; exit 1; }
          source_commit="$(git -C firmware rev-parse HEAD)"
          config_commit="$(git -C firmware/src/config rev-parse HEAD 2>/dev/null || echo external-config-master)"
          build_key="${BUILD_KEY:-${BUILD_ID}}"
          release_name="${RELEASE_NAME:-${VERSION}}"
          jq -n \
            --arg buildId "${BUILD_ID}" \
            --arg repository "${FIRMWARE_REPOSITORY}" \
            --arg version "${VERSION}" \
            --arg sourceRef "${SOURCE_REF}" \
            --arg configRef "${CONFIG_REF:-${config_commit}}" \
            --arg target "${REQUEST_TARGET}" \
            --arg sourceCommit "${source_commit}" \
            --arg configCommit "${config_commit}" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson flags "${FLAGS_JSON}" \
            --arg buildKey "${build_key}" \
            --arg releaseName "${release_name}" \
            '{buildId:$buildId,buildKey:$buildKey,releaseName:$releaseName,repository:$repository,version:$version,sourceRef:$sourceRef,configRef:$configRef,target:$target,flags:$flags,sourceCommit:$sourceCommit,configCommit:$configCommit,builtAt:$builtAt}' > output/manifest.json
          sha256sum output/* > output/SHA256SUMS

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaack-${{ inputs.build_id }}
          path: output/
          retention-days: 30

      - name: Publish verified firmware to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" || -z "${R2_BUCKET_NAME}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "R2 not configured; keeping the GitHub Actions artifact only."
            exit 0
          fi
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          while IFS= read -r firmware_file; do
            extension="${firmware_file##*.}"
            aws s3 cp "${firmware_file}" "s3://${R2_BUCKET_NAME}/firmware/${BUILD_ID}.${extension}" --endpoint-url "${endpoint}"
          done < <(find output -maxdepth 1 -type f \( -name '*.hex' -o -name '*.uf2' \) -size +0c -print)
          aws s3 cp output/manifest.json "s3://${R2_BUCKET_NAME}/firmware/${BUILD_ID}.json" --endpoint-url "${endpoint}"
          aws s3 cp output/SHA256SUMS "s3://${R2_BUCKET_NAME}/firmware/${BUILD_ID}.SHA256SUMS" --endpoint-url "${endpoint}"
