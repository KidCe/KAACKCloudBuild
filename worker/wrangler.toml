name = "kaack-cloud-builder-api"
main = "index.js"
compatibility_date = "2026-08-23"
workers_dev = true

[vars]
FIRMWARE_REPOSITORY = "limonspb/betaflight"
BETAFLIGHT_REPOSITORY = "betaflight/betaflight"
FIRMWARE_CONFIG_REPOSITORY = "betaflight/config"
BETAFLIGHT_45_CONFIG_REF = "92c695af8a2756d75152b54959de28d48fc25cf7"
FIRMWARE_SOURCE_REFS = '[{"release":"kaack-4.5.3-v19","label":"KAACK 4.5.3 / V19","type":"Community","ref":"KAACK-4.5.0","buildRef":"8cd44381217948c0b2b5087f12e17dde15d6a25c","configRef":"9a9f899aab4c4ffaa74f973a643447b48453ff54","unsupportedFlags":["USE_CHIRP","USE_OPTICALFLOW","USE_SERIALRX_MAVLINK"]},{"release":"kaack-2025.12","label":"KAACK 2025.12","type":"Community","ref":"KAACK-2025.12","buildRef":"3b419ca431ba5ea791d7924c8c5b266b911da5b1"}]'
GITHUB_REPOSITORY = "KidCe/KAACKCloudBuild"
GITHUB_REF = "main"
# Set these in the Cloudflare dashboard or with `wrangler secret put`.
# UPSTREAM_BUILD_API = "https://build.betaflight.com"
# CATALOG_PROBE_TARGET = "KAKUTEH7"
# The public KAACK source is the Limon/Ivan Efimov Betaflight fork.
# CATALOG_SOURCE_REF = "KAACK-4.5.0"
# PUBLIC_API_BASE_URL = "https://kaack-cloud-builder-api.example.workers.dev"

# Enable after activating R2, creating the bucket and adding the matching
# R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY GitHub secrets.
